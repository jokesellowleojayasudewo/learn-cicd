name: Audit Infrastruktur Otomatis

on:
  push:
    branches: [ "main" ]

jobs:
  audit-server:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Cek Koneksi dan Sistem Operasi Server
        run: uname -a

      - name: 2. Periksa Total Kapasitas RAM Server
        run: free -h

      - name: 3. Periksa Kapasitas Harddisk / Penyimpanan
        run: df -h

      - name: 4. Cek Alamat IP Jaringan Server Virtual
        run: curl ifconfig.me
